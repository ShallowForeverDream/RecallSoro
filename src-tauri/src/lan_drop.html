<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>RecallSoro · 手机快传</title>
  <style>
    :root {
      --bg: #f7f6f3;
      --card: #ffffff;
      --ink: #1c1917;
      --muted: #78716c;
      --line: rgba(28, 25, 23, 0.1);
      --accent: #3b5bdb;
      --accent-soft: #edf2ff;
      --good: #15803d;
      --good-bg: #dcfce7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px 16px 40px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    .wrap { max-width: 480px; margin: 0 auto; }
    .head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .mark {
      width: 40px; height: 40px; border-radius: 11px;
      background: linear-gradient(135deg, #3b5bdb, #5c7cfa);
      color: #fff; font-weight: 700; font-size: 19px;
      display: grid; place-items: center; flex: 0 0 40px;
    }
    h1 { margin: 0; font-size: 19px; }
    .sub { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }
    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 16px; padding: 18px; margin-bottom: 14px;
      box-shadow: 0 4px 16px rgba(28, 25, 23, 0.04);
    }
    .label { font-size: 12.5px; font-weight: 600; color: var(--muted); margin-bottom: 8px; display: block; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .chip {
      border: 1px solid var(--line); background: var(--bg); color: var(--ink);
      border-radius: 99px; padding: 6px 13px; font-size: 13px; font-weight: 500;
    }
    .chip.active { background: var(--ink); color: #fff; border-color: var(--ink); }
    input[type="text"] {
      width: 100%; padding: 11px 12px; border: 1px solid var(--line);
      border-radius: 10px; font-size: 14px; outline: none; background: #faf9f6;
    }
    input[type="text"]:focus { border-color: var(--accent); background: #fff; }
    .pick-box {
      margin-top: 14px; border: 1.5px dashed rgba(59, 91, 219, 0.45);
      background: var(--accent-soft); color: var(--accent);
      border-radius: 14px; padding: 26px 16px; text-align: center;
      font-weight: 600; font-size: 15px; cursor: pointer; display: block;
    }
    .pick-box small { display: block; margin-top: 6px; font-weight: 400; font-size: 12px; color: var(--muted); }
    .list { display: flex; flex-direction: column; gap: 8px; }
    .item {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 12px; border-radius: 10px; background: #faf9f6; border: 1px solid var(--line);
      font-size: 13px;
    }
    .item-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .badge { font-size: 11.5px; padding: 2px 8px; border-radius: 99px; background: var(--good-bg); color: var(--good); font-weight: 600; }
    .badge.pending { background: #e0e7ff; color: #3730a3; }
    .badge.err { background: #ffe4e6; color: #be123c; }
    .tip { font-size: 12px; color: var(--muted); text-align: center; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div class="mark">R</div>
      <div>
        <h1>RecallSoro 手机快传</h1>
        <p class="sub">照片直达电脑收件箱 · 仅在局域网传输</p>
      </div>
    </div>

    <div class="card">
      <span class="label">1. 可选：标记这张照片的用途</span>
      <div class="chips" id="slots">
        <button type="button" class="chip active" data-slot="证书照片">证书照片</button>
        <button type="button" class="chip" data-slot="奖牌照片">奖牌照片</button>
        <button type="button" class="chip" data-slot="合照">合照</button>
        <button type="button" class="chip" data-slot="相关图片">相关图片</button>
        <button type="button" class="chip" data-slot="随手资料">随手资料</button>
      </div>

      <span class="label">2. 可选：写一句备注（如比赛名）</span>
      <input type="text" id="note" placeholder="例如：2026 蓝桥杯省赛一等奖证书" />

      <label class="pick-box" for="fileInput">
        点击拍照或从相册选择照片 / PDF
        <small>支持一次多选，电脑端自动 SHA-256 去重</small>
      </label>
      <input id="fileInput" type="file" multiple accept="image/*,.pdf" style="display:none" />
    </div>

    <div class="card" id="logCard" style="display:none">
      <span class="label">本次已传送</span>
      <div class="list" id="logList"></div>
    </div>

    <p class="tip">关闭电脑端「手机传图」窗口后，本连接自动失效。</p>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get('token') || '';
    let activeSlot = '证书照片';

    document.getElementById('slots').addEventListener('click', (e) => {
      const btn = e.target.closest('.chip');
      if (!btn) return;
      document.querySelectorAll('.chip').forEach((el) => el.classList.remove('active'));
      btn.classList.add('active');
      activeSlot = btn.dataset.slot;
    });

    const fileInput = document.getElementById('fileInput');
    const logCard = document.getElementById('logCard');
    const logList = document.getElementById('logList');

    fileInput.addEventListener('change', async () => {
      const files = Array.from(fileInput.files || []);
      if (!files.length) return;
      logCard.style.display = 'block';
      const note = document.getElementById('note').value.trim();

      for (const file of files) {
        const row = document.createElement('div');
        row.className = 'item';
        const nameEl = document.createElement('span');
        nameEl.className = 'item-name';
        nameEl.textContent = file.name;
        const badge = document.createElement('span');
        badge.className = 'badge pending';
        badge.textContent = '传输中…';
        row.appendChild(nameEl);
        row.appendChild(badge);
        logList.prepend(row);

        try {
          const qs = new URLSearchParams({
            token,
            name: file.name,
            mime: file.type || 'application/octet-stream',
            slot: activeSlot,
            note,
          });
          const resp = await fetch('/upload?' + qs.toString(), {
            method: 'POST',
            headers: { 'Content-Type': 'application/octet-stream' },
            body: file,
          });
          const data = await resp.json();
          if (resp.ok && data.ok) {
            badge.className = 'badge';
            badge.textContent = data.deduplicated ? '已去重复用' : '已送达电脑';
          } else {
            badge.className = 'badge err';
            badge.textContent = data.error || '失败';
          }
        } catch {
          badge.className = 'badge err';
          badge.textContent = '连接断开';
        }
      }
      fileInput.value = '';
    });
  </script>
</body>
</html>
